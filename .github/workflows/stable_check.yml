name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [native, js]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: install
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100

      - name: install Node.js
        if: matrix.target == 'js'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: moon version
        run: |
          moon version --all

      - name: moon update
        run: |
          moon update

      - name: moon check
        run: moon check --target ${{ matrix.target }}

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: info check
        run: |
          moon info --target ${{ matrix.target }}
          git diff --exit-code

      - name: Set ulimit
        if: runner.os != 'Windows'
        run: |
          ulimit -s 8176

      - name: moon test
        run: |
          moon test --target ${{ matrix.target }}
